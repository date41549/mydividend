name: CI

# 品質ゲート：型チェック / Lint / テストを PR と main/master への push で自動実行する。
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # package-lock.json は追跡しない（OS間非互換でEASビルドが壊れるため）ので npm install を使う
      - run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --ci
